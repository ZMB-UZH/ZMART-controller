[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zmart-controller"
version = "0.4.0rc8"
description = "One small, consistent way to drive any microscope from Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
keywords = ["microscopy", "smart-microscopy", "microscope-control", "automation"]
# The controller only forwards calls to a driver, so it needs nothing beyond
# the Python standard library.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Acquisition",
]

[project.urls]
Homepage = "https://github.com/ZMB-UZH/ZMART-controller"
Repository = "https://github.com/ZMB-UZH/ZMART-controller"
Issues = "https://github.com/ZMB-UZH/ZMART-controller/issues"
"ZMART microscopy" = "https://github.com/ZMB-UZH/ZMART-microscopy"

[project.optional-dependencies]
# pytest runs the tests.
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["zmart_controller*"]

[tool.setuptools.package-data]
# The template's plugin folder: its settings file and its class.
"zmart_controller.template" = ["zmart_controller_plugin/*.json", "zmart_controller_plugin/*.py"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
# Code blocks in the markdown pages are examples, laid out for reading.
exclude = ["*.md"]
quote-style = "double"
indent-style = "space"
